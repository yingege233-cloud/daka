<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日打卡 · 学习记录本</title>
  <style>
    /* ============ 这一块是"样式"，决定网页长什么样 ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(160deg, #e8f0fe 0%, #fdf6ec 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 460px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 28px 24px;
    }

    .card h1 {
      font-size: 26px;
      color: #2b3a55;
      margin-bottom: 6px;
    }

    .date {
      color: #8a94a6;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      color: #2b3a55;
      margin: 26px 0 12px;
    }

    /* ---------- 日历 ---------- */
    .cal-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .cal-header button {
      border: none;
      background: #eef1f6;
      color: #4d7cfe;
      font-size: 16px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
    }

    .cal-header button:hover { background: #e2e7ef; }

    #calTitle {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      color: #2b3a55;
    }

    #todayBtn {
      width: auto;
      padding: 0 12px;
      font-size: 13px;
      color: #667085;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-weekday {
      text-align: center;
      font-size: 12px;
      color: #8a94a6;
      padding: 4px 0;
    }

    .day {
      position: relative;
      border-radius: 8px;
      padding: 6px 2px 4px;
      text-align: center;
      min-height: 52px;
      background: #f8fafc;
      cursor: pointer;
    }

    .day:hover { background: #eef2fa; }

    .day.other { background: transparent; cursor: default; }
    .day.other:hover { background: transparent; }

    /* 今天的格子：蓝色边框 */
    .day.today { box-shadow: inset 0 0 0 2px #4d7cfe; }

    .day-num { display: block; font-size: 13px; color: #33415c; font-weight: bold; }
    .day.other .day-num { color: #c3cad6; }

    /* 打卡圆点：蓝点=打过卡，绿点=当天全部完成 */
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-top: 3px; }
    .dot.blue { background: #4d7cfe; }
    .dot.green { background: #34c759; }

    .holiday-label {
      display: block;
      font-size: 10px;
      color: #e8590c;
      margin-top: 2px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .legend {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-top: 12px;
      font-size: 12px;
      color: #8a94a6;
    }

    .legend-item { display: flex; align-items: center; gap: 5px; }
    .dot.small { width: 7px; height: 7px; margin: 0; }

    /* ---------- 今日打卡 ---------- */
    .progress-area {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .progress-bar {
      flex: 1;
      height: 10px;
      background: #eef1f6;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6ea8fe, #4d7cfe);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 14px;
      color: #4d7cfe;
      font-weight: bold;
      white-space: nowrap;
    }

    .habit {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
      user-select: none;
    }

    .habit:hover { background: #f6f8fc; }

    .habit input {
      width: 22px;
      height: 22px;
      accent-color: #4d7cfe;
      cursor: pointer;
      flex-shrink: 0;
    }

    .habit span {
      font-size: 17px;
      color: #33415c;
    }

    /* 打勾之后：文字变灰、加删除线 */
    .habit.done span {
      text-decoration: line-through;
      color: #aab3c5;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-size: 15px;
      color: #4d7cfe;
      min-height: 22px;
    }

    .reset {
      display: block;
      margin: 14px auto 0;
      border: none;
      background: #eef1f6;
      color: #667085;
      padding: 8px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
    }

    .reset:hover { background: #e2e7ef; }

    /* ---------- 节日管理 ---------- */
    .holiday-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .holiday-form input[type="text"] { flex: 1 1 100%; }

    .holiday-form input,
    .holiday-form select {
      padding: 9px 12px;
      border: 1px solid #dfe5ee;
      border-radius: 10px;
      font-size: 14px;
      color: #33415c;
      background: #fff;
    }

    .holiday-form input[type="date"] { flex: 1; min-width: 120px; }
    .holiday-form select { flex: 1; min-width: 110px; }

    #addHoliday {
      border: none;
      background: #4d7cfe;
      color: #fff;
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 14px;
      cursor: pointer;
    }

    #addHoliday:hover { background: #3b6ae0; }

    .holiday-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #f8fafc;
      border-radius: 10px;
      margin-bottom: 6px;
    }

    .h-name { flex: 1; font-size: 15px; color: #33415c; }
    .h-meta { font-size: 12px; color: #8a94a6; }

    .h-del {
      border: none;
      background: #fdecea;
      color: #e0524d;
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .h-del:hover { background: #fbdbd8; }

    .empty-note { font-size: 13px; color: #aab3c5; padding: 8px 4px; }
    .builtin-note { font-size: 12px; color: #b0b7c3; margin-top: 4px; }

    /* ---------- 底部提示 ---------- */
    .hint {
      margin-top: 16px;
      text-align: center;
      font-size: 12px;
      color: #b0b7c3;
    }

    /* ---------- 点日期弹出的详情窗 ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(43, 58, 85, 0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .popup {
      background: #fff;
      border-radius: 16px;
      padding: 22px 20px;
      width: min(330px, 88vw);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
      max-height: 80vh;
      overflow-y: auto;
    }

    .popup-title {
      font-size: 17px;
      font-weight: bold;
      color: #2b3a55;
      margin-bottom: 12px;
    }

    .popup-body { font-size: 14px; color: #33415c; line-height: 1.9; }

    #closePopup {
      display: block;
      margin: 14px auto 0;
      border: none;
      background: #eef1f6;
      color: #667085;
      padding: 8px 22px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
    }

    #closePopup:hover { background: #e2e7ef; }
  </style>
</head>
<body>
  <div class="card">
    <h1>每日打卡 🌟</h1>
    <div class="date" id="today"></div>

    <!-- ========== 日历 ========== -->
    <div class="section-title">📅 打卡日历</div>
    <div class="cal-header">
      <button id="prevMonth">‹</button>
      <span id="calTitle"></span>
      <button id="nextMonth">›</button>
      <button id="todayBtn">今天</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend">
      <span class="legend-item"><span class="dot small blue"></span>打过卡</span>
      <span class="legend-item"><span class="dot small green"></span>全部完成</span>
      <span class="legend-item">🔵 蓝框 = 今天</span>
    </div>

    <!-- ========== 今日打卡 ========== -->
    <div class="section-title">☑️ 今日打卡</div>
    <div class="progress-area">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">0/0</div>
    </div>
    <div id="habitList"></div>
    <div class="message" id="message"></div>
    <button class="reset" id="resetBtn">重新勾选</button>

    <!-- ========== 节日管理 ========== -->
    <div class="section-title">🎉 我的节日</div>
    <div id="holidayList"></div>
    <div class="holiday-form">
      <input type="text" id="holidayName" placeholder="节日名称，比如：我的生日">
      <input type="date" id="holidayDate">
      <select id="holidayRepeat">
        <option value="yearly">每年重复</option>
        <option value="once">只此一次</option>
      </select>
      <button id="addHoliday">添加</button>
    </div>
    <div class="builtin-note">内置节日：元旦、劳动节、儿童节、国庆节（每年重复）</div>

    <div class="hint">数据保存在你的浏览器里，刷新不丢 ✓</div>
  </div>

  <!-- ========== 日期详情弹窗 ========== -->
  <div class="overlay" id="overlay" style="display:none">
    <div class="popup">
      <div class="popup-title" id="popupTitle"></div>
      <div class="popup-body" id="popupBody"></div>
      <button id="closePopup">关闭</button>
    </div>
  </div>

  <script>
    // ============ 这一块是"逻辑"，决定网页怎么动 ============

    // 想改习惯？改下面这一行的文字就行（注意用英文单引号、逗号隔开）
    var habits = ['喝水 4 杯', '运动 60分钟', '课外学习 30 分钟', '早睡（24 点前）', '一日三餐不吃外卖'];

    var weekNames = ['日', '一', '二', '三', '四', '五', '六'];

    // ---------- 内置法定节日（每年重复，不用你自己加） ----------
    var builtinHolidays = [
      { name: '元旦',   m: 1,  d: 1 },
      { name: '劳动节', m: 5,  d: 1 },
      { name: '儿童节', m: 6,  d: 1 },
      { name: '国庆节', m: 10, d: 1 }
    ];

    // ---------- 你添加的节日（存在浏览器里） ----------
    // 每年重复的：{ name, m, d, yearly: true }
    // 只此一次的：{ name, date: "2025-07-01", yearly: false }
    var userHolidays = [];
    try {
      var savedH = localStorage.getItem('daka_holidays');
      if (savedH) userHolidays = JSON.parse(savedH);
    } catch (e) { userHolidays = []; }

    function allHolidays() {
      return builtinHolidays.concat(userHolidays);
    }

    function saveHolidays() {
      localStorage.setItem('daka_holidays', JSON.stringify(userHolidays));
    }

    // ---------- 打卡记录（存在浏览器里） ----------
    // 样子：{ "2025-06-15": ["喝水 8 杯", "学习 30 分钟"], ... }
    var records = {};
    try {
      var savedR = localStorage.getItem('daka_records');
      if (savedR) records = JSON.parse(savedR);
    } catch (e) { records = {}; }

    function dateKey(y, m, d) {
      function pad(n) { return (n < 10 ? '0' : '') + n; }
      return y + '-' + pad(m) + '-' + pad(d);
    }

    // ---------- 今天 ----------
    var now = new Date();
    var todayY = now.getFullYear();
    var todayM = now.getMonth() + 1;
    var todayD = now.getDate();
    var todayKey = dateKey(todayY, todayM, todayD);

    document.getElementById('today').textContent =
      todayY + ' 年 ' + todayM + ' 月 ' + todayD + ' 日 · 星期' + weekNames[now.getDay()];

    // ============ 今日打卡部分 ============
    var list = document.getElementById('habitList');
    for (var i = 0; i < habits.length; i++) {
      var row = document.createElement('label');
      row.className = 'habit';
      row.innerHTML =
        '<input type="checkbox" id="h' + i + '" onchange="onCheck()">' +
        '<span>' + habits[i] + '</span>';
      list.appendChild(row);
    }

    // 勾选变化时：保存记录 + 更新进度条 + 刷新日历
    function onCheck() {
      var boxes = document.querySelectorAll('.habit input');
      var rows = document.querySelectorAll('.habit');
      var checkedNames = [];
      for (var i = 0; i < boxes.length; i++) {
        if (boxes[i].checked) {
          checkedNames.push(habits[i]);
          rows[i].classList.add('done');
        } else {
          rows[i].classList.remove('done');
        }
      }
      records[todayKey] = checkedNames; // 记住今天打了哪些勾
      localStorage.setItem('daka_records', JSON.stringify(records));
      updateProgress();
      renderCalendar();
    }

    function updateProgress() {
      var boxes = document.querySelectorAll('.habit input');
      var done = 0;
      for (var i = 0; i < boxes.length; i++) {
        if (boxes[i].checked) done++;
      }
      var total = boxes.length;
      var percent = Math.round((done / total) * 100);
      document.getElementById('progressFill').style.width = percent + '%';
      document.getElementById('progressText').textContent = done + '/' + total;

      var msg = document.getElementById('message');
      if (done === 0) {
        msg.textContent = '';
      } else if (done < total) {
        msg.textContent = '加油，还差 ' + (total - done) + ' 项就全勤啦 💪';
      } else {
        msg.textContent = '全部完成！今天也是满分的一天 🎉';
      }
    }

    document.getElementById('resetBtn').onclick = function () {
      var boxes = document.querySelectorAll('.habit input');
      for (var i = 0; i < boxes.length; i++) {
        boxes[i].checked = false;
      }
      onCheck(); // 顺便保存"今天什么都没打"
    };

    // ============ 日历部分 ============
    var viewY = todayY;
    var viewM = todayM; // 当前在看的月份（1 月 = 1）

    function holidaysOn(y, m, d) {
      var out = [];
      var all = allHolidays();
      for (var i = 0; i < all.length; i++) {
        var h = all[i];
        if (h.yearly) {
          if (h.m === m && h.d === d) out.push(h.name);
        } else {
          if (h.date === dateKey(y, m, d)) out.push(h.name);
        }
      }
      return out;
    }

    function renderCalendar() {
      document.getElementById('calTitle').textContent = viewY + ' 年 ' + viewM + ' 月';

      var html = '';
      var weekdays = ['一', '二', '三', '四', '五', '六', '日'];
      for (var w = 0; w < 7; w++) {
        html += '<div class="cal-weekday">' + weekdays[w] + '</div>';
      }

      var first = new Date(viewY, viewM - 1, 1);
      var lead = (first.getDay() + 6) % 7; // 这个月第一天前面空几格（周一开头）
      var daysInMonth = new Date(viewY, viewM, 0).getDate();

      for (var i = 0; i < lead; i++) {
        html += '<div class="day other"></div>';
      }

      for (var d = 1; d <= daysInMonth; d++) {
        var key = dateKey(viewY, viewM, d);
        var rec = records[key];
        var hasRecord = rec && rec.length > 0;
        var allDone = hasRecord && rec.length >= habits.length;
        var dotClass = '';
        if (hasRecord) {
          dotClass = allDone ? 'dot green' : 'dot blue';
        }

        var hols = holidaysOn(viewY, viewM, d);
        var holLabel = '';
        if (hols.length > 0) {
          var label = hols.length > 1 ? hols[0] + ' +' + (hols.length - 1) : hols[0];
          holLabel = '<span class="holiday-label">' + label + '</span>';
        }

        var todayClass = (viewY === todayY && viewM === todayM && d === todayD) ? ' today' : '';

        html += '<div class="day' + todayClass + '" onclick="showDay(' + viewY + ',' + viewM + ',' + d + ')">' +
          '<span class="day-num">' + d + '</span>' +
          (dotClass ? '<span class="' + dotClass + '"></span>' : '') +
          holLabel +
          '</div>';
      }

      document.getElementById('calGrid').innerHTML = html;
    }

    // 点某一天 → 弹出详情（只看，不能改）
    function showDay(y, m, d) {
      var key = dateKey(y, m, d);
      var rec = records[key] || [];

      var title = y + ' 年 ' + m + ' 月 ' + d + ' 日 · 星期' + weekNames[new Date(y, m - 1, d).getDay()];

      var body = '<div style="font-weight:bold;margin-bottom:6px;">打卡情况</div>';
      if (rec.length === 0) {
        body += '<div style="color:#8a94a6;">这天没有打卡记录</div>';
      } else {
        body += '<ul style="padding-left:18px;margin:0;">';
        for (var i = 0; i < rec.length; i++) {
          body += '<li>' + rec[i] + ' ✓</li>';
        }
        body += '</ul>';
      }

      var hols = holidaysOn(y, m, d);
      body += '<div style="font-weight:bold;margin:10px 0 6px;">节日</div>';
      body += hols.length > 0 ? hols.join('、') : '<span style="color:#8a94a6;">无</span>';

      document.getElementById('popupTitle').textContent = title;
      document.getElementById('popupBody').innerHTML = body;
      document.getElementById('overlay').style.display = 'flex';
    }

    document.getElementById('prevMonth').onclick = function () {
      viewM--;
      if (viewM < 1) { viewM = 12; viewY--; }
      renderCalendar();
    };

    document.getElementById('nextMonth').onclick = function () {
      viewM++;
      if (viewM > 12) { viewM = 1; viewY++; }
      renderCalendar();
    };

    document.getElementById('todayBtn').onclick = function () {
      viewY = todayY;
      viewM = todayM;
      renderCalendar();
    };

    document.getElementById('closePopup').onclick = function () {
      document.getElementById('overlay').style.display = 'none';
    };

    // 点弹窗外面（灰色背景）也能关闭
    document.getElementById('overlay').onclick = function (e) {
      if (e.target === this) this.style.display = 'none';
    };

    // ============ 节日管理部分 ============
    function renderHolidayList() {
      var listEl = document.getElementById('holidayList');
      if (userHolidays.length === 0) {
        listEl.innerHTML = '<div class="empty-note">还没有添加节日，用下面的表单添加吧～</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < userHolidays.length; i++) {
        var h = userHolidays[i];
        var when = h.yearly ? '每年 ' + h.m + ' 月 ' + h.d + ' 日' : h.date;
        html += '<div class="holiday-row">' +
          '<span class="h-name">' + h.name + '</span>' +
          '<span class="h-meta">' + when + '</span>' +
          '<button class="h-del" onclick="delHoliday(' + i + ')">删除</button>' +
          '</div>';
      }
      listEl.innerHTML = html;
    }

    function delHoliday(i) {
      if (confirm('确定删除「' + userHolidays[i].name + '」吗？')) {
        userHolidays.splice(i, 1);
        saveHolidays();
        renderHolidayList();
        renderCalendar();
      }
    }

    document.getElementById('addHoliday').onclick = function () {
      var name = document.getElementById('holidayName').value.trim();
      var dateStr = document.getElementById('holidayDate').value;
      var repeat = document.getElementById('holidayRepeat').value;

      if (!name) { alert('请先填写节日名称'); return; }
      if (!dateStr) { alert('请先选择日期'); return; }

      if (repeat === 'yearly') {
        var parts = dateStr.split('-'); // 比如 "2025-06-15"
        userHolidays.push({ name: name, m: parseInt(parts[1], 10), d: parseInt(parts[2], 10), yearly: true });
      } else {
        userHolidays.push({ name: name, date: dateStr, yearly: false });
      }

      saveHolidays();
      document.getElementById('holidayName').value = '';
      document.getElementById('holidayDate').value = '';
      renderHolidayList();
      renderCalendar();
    };

    // ============ 打开网页时的初始化 ============
    renderHolidayList();
    renderCalendar();
    updateProgress();
  </script>
</body>
</html>
